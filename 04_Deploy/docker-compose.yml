services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: eldent_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eldent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eldent_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-eldent_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldent_user -d eldent_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eldent_network

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ..
      dockerfile: 04_Deploy/backend.Dockerfile
    container_name: eldent_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eldent_user}:${POSTGRES_PASSWORD:-eldent_secure_pass_2026}@db:5432/${POSTGRES_DB:-eldent_db}
      SECRET_KEY: ${SECRET_KEY:-eldent_super_secret_jwt_key_change_in_production_2026}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eldent_network

  # 3. Patient Web Application (React)
  web:
    build:
      context: ..
      dockerfile: 04_Deploy/web.Dockerfile
    container_name: eldent_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - eldent_network

  # 4. Admin Portal (React)
  admin:
    build:
      context: ..
      dockerfile: 04_Deploy/admin.Dockerfile
    container_name: eldent_admin
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - eldent_network

volumes:
  postgres_data:
    driver: local

networks:
  eldent_network:
    driver: bridge
